# Attendiphi continuous integration — no deploy, no production secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  release-secret-gate:
    name: Release secret contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Script requires ≥16-char CHECKIN secret in CI
        run: |
          set -euo pipefail
          grep -q 'ATTENDIPHI_REQUIRE_SECRET\|CI' scripts/build_web_release.sh
          grep -q 'must be at least 16' scripts/build_web_release.sh
          grep -q 'SUPABASE_URL' scripts/build_web_release.sh
          # Missing env in CI must fail (ignores local .secrets).
          if CI=true env -u CHECKIN_SESSION_TOKEN_SECRET \
            bash scripts/build_web_release.sh >/tmp/secret_err.txt 2>&1; then
            echo "expected failure when secret missing in CI" >&2
            cat /tmp/secret_err.txt >&2
            exit 1
          fi
          grep -qi 'CHECKIN_SESSION_TOKEN_SECRET' /tmp/secret_err.txt
          # Short secret must fail before flutter build.
          if CI=true CHECKIN_SESSION_TOKEN_SECRET=shortsecret123 \
            SUPABASE_URL=https://example.supabase.co \
            SUPABASE_ANON_KEY=testkey \
            bash scripts/build_web_release.sh >/tmp/short_err.txt 2>&1; then
            echo "expected failure for short secret" >&2
            cat /tmp/short_err.txt >&2
            exit 1
          fi
          grep -qi 'at least 16' /tmp/short_err.txt
          echo "release secret contract ok"
